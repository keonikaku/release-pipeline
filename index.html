<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>An ongoing release-management project | release-pipeline</title>
    <meta
      name="description"
      content="A real release process, end to end: quality gates, a human approval, a live check and a backout record, each step linked to the run that shows it."
    />
    <!-- Contract with deploy.yml: the rollback smoke greps the stored build
         for this exact tag to decide whether to expect the landing page.
         Do not rename it or reorder its attributes. -->
    <meta name="release-pipeline:page" content="landing" />
    <style>
      /* The QA site's palette. System fonts only: 'Inter' and 'JetBrains
         Mono' are named first so a reader who has them installed gets them,
         but nothing is fetched from another origin. The page's claim is that
         what is served is what was tested, and a font from a font host is
         outside that check. --muted-dim fails body-text contrast (3.3 to 3.6
         against these backgrounds): borders and decoration only. */
      :root {
        color-scheme: dark;
        --bg: #0a0e14;
        --bg-soft: #0d1219;
        --panel: #111826;
        --line: #232e40;
        --line-soft: #1a2434;
        --txt: #eef2f7;
        --muted: #8b9bb0;
        --muted-dim: #5c6c81;
        --accent: #4fd1ff;
        --grad: linear-gradient(120deg, #4fd1ff 0%, #7c9cff 55%, #34d399 100%);
        --radius: 16px;
        --shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.55);
        --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas,
          monospace;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        background: var(--bg);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        background: var(--bg);
        color: var(--txt);
        font-family: var(--sans);
        font-size: 1rem;
        line-height: 1.6;
        margin: 0 auto;
        max-width: 46rem;
        padding: 3.5rem 1.25rem 3rem;
      }
      code {
        font-family: var(--mono);
        font-size: 0.9em;
      }

      /* Links: underlined, so they read as links without relying on color. */
      a {
        color: var(--accent);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.2em;
        overflow-wrap: anywhere;
      }
      a:hover {
        text-decoration-thickness: 2px;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 4px;
      }

      /* Intro. The gradient is a thin bar above the h1, decoration only, with
         a solid accent fallback; the heading itself stays solid --txt. */
      .intro {
        margin-bottom: 3rem;
      }
      .intro::before {
        background-color: var(--accent);
        background-image: var(--grad);
        border-radius: 2px;
        content: "";
        display: block;
        height: 3px;
        margin-bottom: 1.5rem;
        width: 3.5rem;
      }
      h1 {
        color: var(--txt);
        font-size: clamp(1.75rem, 1.2rem + 2.4vw, 2.5rem);
        letter-spacing: -0.02em;
        line-height: 1.15;
        margin: 0 0 1.25rem;
      }
      .lead {
        font-size: 1.125rem;
        margin: 0 0 1rem;
      }
      .byline {
        color: var(--muted);
        font-size: 0.95rem;
        margin: 0;
      }

      /* Sections */
      section {
        border-top: 1px solid var(--line-soft);
        margin-top: 2.75rem;
        padding-top: 2.25rem;
      }
      h2 {
        font-size: 1.35rem;
        letter-spacing: -0.01em;
        line-height: 1.3;
        margin: 0 0 1rem;
      }
      h3 {
        font-size: 1rem;
        margin: 1.75rem 0 0.75rem;
      }
      h2 + h3 {
        margin-top: 0;
      }
      p {
        margin: 0 0 0.75rem;
      }
      .summary,
      .freeze {
        color: var(--muted);
      }
      .summary {
        margin-bottom: 1.25rem;
      }
      .freeze {
        margin-top: 1.25rem;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 1.25rem 1.25rem 1rem;
      }

      /* Link groups */
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem 1.25rem;
        list-style: none;
        margin: 1rem 0 0;
        padding: 0;
      }
      .links li {
        min-width: 0;
      }

      /* Now live */
      .build p {
        overflow-wrap: anywhere;
      }
      .build [data-testid="page-build"] {
        font-family: var(--mono);
        font-size: 0.85rem;
      }
      .build button {
        background: var(--bg-soft);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--txt);
        cursor: pointer;
        font: inherit;
        font-size: 0.95rem;
        padding: 0.45rem 1rem;
      }
      .build button:hover {
        border-color: var(--accent);
      }
      .build button[aria-disabled="true"] {
        cursor: progress;
      }
      .build .result {
        margin: 0.75rem 0 0;
      }
      .build .result:empty {
        margin: 0;
      }
      .build .result[data-result="mismatch"],
      .build .result[data-result="unreadable"] {
        font-weight: 600;
      }

      /* The flow */
      .flow {
        margin: 0;
        padding-left: 1.5rem;
      }
      .flow li {
        padding: 0.35rem 0 0.35rem 0.25rem;
      }
      .flow li::marker {
        color: var(--accent);
        font-family: var(--mono);
      }
      .flow span {
        color: var(--muted);
      }

      /* Gates and releases share the row layout. */
      .gates,
      .releases,
      .evidence {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .gates li,
      .releases li {
        border-top: 1px solid var(--line-soft);
        display: grid;
        gap: 0.1rem 1rem;
        grid-template-columns: 7.5rem minmax(0, 1fr);
        padding: 0.75rem 0;
      }
      .gates li:last-child,
      .releases li:last-child {
        border-bottom: 1px solid var(--line-soft);
      }
      .gates code,
      .releases code {
        font-size: 0.9rem;
        font-weight: 600;
      }
      .tool,
      .note,
      .releases time {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .question,
      .note {
        grid-column: 2;
      }
      .releases li {
        grid-template-columns: 5.5rem minmax(0, 1fr);
      }
      .releases a {
        grid-row: span 2;
      }

      /* Evidence */
      .evidence {
        display: grid;
        gap: 1rem;
      }
      .evidence p {
        overflow-wrap: break-word;
      }
      .evidence .meta {
        align-items: center;
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        font-size: 0.85rem;
        gap: 0.5rem 0.75rem;
        margin-bottom: 0.5rem;
      }
      .evidence .links {
        font-size: 0.95rem;
        margin-top: 0.5rem;
      }
      /* The tag is text first. The border style repeats it for a quick scan:
         solid for observed, dashed for inferred. */
      .tag {
        border: 1px solid var(--accent);
        border-radius: 999px;
        color: var(--txt);
        font-family: var(--mono);
        font-size: 0.75rem;
        letter-spacing: 0.04em;
        line-height: 1;
        padding: 0.3rem 0.6rem;
        text-transform: uppercase;
      }
      .tag[data-tag="inferred"] {
        border-color: var(--muted);
        border-style: dashed;
        color: var(--muted);
      }

      footer {
        border-top: 1px solid var(--line-soft);
        color: var(--muted);
        font-size: 0.85rem;
        margin-top: 3rem;
        padding-top: 1.5rem;
      }

      @media (max-width: 30rem) {
        body {
          padding-top: 2.5rem;
        }
        .gates li {
          grid-template-columns: minmax(0, 1fr);
        }
        .gates .question,
        .gates .note {
          grid-column: 1;
        }
        .panel {
          padding: 1rem 1rem 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Rendered by src/main.ts. Empty here so the e2e gate is asserting on
         what the script produced and not on markup shipped alongside it. -->
    <main id="app"></main>
    <footer>
      The application is the fixture. The pipeline is the artifact.
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
