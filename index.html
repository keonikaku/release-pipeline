<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>release-pipeline</title>
    <meta
      name="description"
      content="The gate set a change has to pass to reach production in this repository."
    />
    <style>
      :root {
        color-scheme: light dark;
        --rule: color-mix(in srgb, currentcolor 15%, transparent);
      }
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        line-height: 1.5;
        margin: 0 auto;
        max-width: 42rem;
        padding: 3rem 1.25rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.25rem;
      }
      .summary {
        margin: 0 0 2rem;
        opacity: 0.75;
      }
      .gates {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .gates li {
        border-top: 1px solid var(--rule);
        display: grid;
        gap: 0.1rem 0.75rem;
        grid-template-columns: 7rem 1fr;
        padding: 0.75rem 0;
      }
      .gates li:last-child {
        border-bottom: 1px solid var(--rule);
      }
      .gates code {
        font-size: 0.95rem;
        font-weight: 600;
      }
      .tool,
      .note {
        font-size: 0.8rem;
        opacity: 0.6;
      }
      .question {
        grid-column: 2;
      }
      .note {
        grid-column: 2;
      }
      footer {
        font-size: 0.85rem;
        margin-top: 2.5rem;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <!-- Rendered by src/main.ts. Empty here so the e2e gate is asserting on
         what the script produced and not on markup shipped alongside it. -->
    <main id="app"></main>
    <footer>
      The application is the fixture. The pipeline is the artifact.
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
