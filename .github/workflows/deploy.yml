name: Deploy

# Put a published release on GitHub Pages, then check the live site. Started
# by hand only. Phase 3, slice 1 (deploy) and slice 2 (smoke). Documented in
# docs/RELEASE.md, which names this file and these jobs.
#
# The same workflow is the deploy and the rollback. Deploying the newest tag is
# a release going live; deploying an older tag is a rollback. Either way it
# deploys the build stored on that release, the archive release.yml attached
# after the full gate set passed on the tagged commit. Nothing is rebuilt from
# source. A rebuild would be a new, untested artifact; the stored one is the
# artifact that was tested.
#
# Run it from main (Actions, Deploy, Run workflow, branch main) with the tag
# to deploy. The deploy job refuses any other branch: see `prepare`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy, for example v0.1.0. An older tag is a rollback."
        required: true
        type: string

# Nothing by default. Each job asks for exactly what it uses.
permissions: {}

concurrency:
  # One deploy at a time, and a running deploy is never cancelled: a cancelled
  # Pages deploy can leave it unclear which version is live. GitHub keeps at
  # most one pending run in a group, so a third dispatch while one runs and one
  # waits cancels the waiting one. docs/RELEASE.md says what to do about that.
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Read the release and its assets, and read this run's own record for the
    # time it was created. Nothing is written.
    permissions:
      contents: read
      actions: read

    outputs:
      started_at: ${{ steps.start.outputs.started_at }}
      timer_basis: ${{ steps.start.outputs.timer_basis }}
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
      commit: ${{ steps.verify.outputs.commit }}

    steps:
      # Time to restore starts when someone presses Run workflow, not when a
      # runner picks the job up, so the clock starts at the run's creation and
      # includes queue and runner wait. On a re-run it is still the first
      # attempt's creation: the clock does not restart because a try failed.
      # If the run record cannot be read, the clock starts here instead and the
      # backout record says so.
      - name: Record when this run was created
        id: start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          created="$(gh api "$RUN_URL" --jq .created_at 2>/dev/null || true)"
          if started="$(date -u -d "$created" +%s 2>/dev/null)" && [ -n "$created" ]; then
            echo "started_at=$started" >> "$GITHUB_OUTPUT"
            echo "timer_basis=from the run's creation ($created), including queue time" >> "$GITHUB_OUTPUT"
          else
            echo "started_at=$(date -u +%s)" >> "$GITHUB_OUTPUT"
            echo "timer_basis=from the start of prepare, excluding queue time (the run's creation time could not be read)" >> "$GITHUB_OUTPUT"
          fi

      # The workflow that runs is the one on the branch it was dispatched from.
      # Only main's copy has been through review, so only main's copy deploys.
      # This holds whatever the github-pages environment's branch rule says.
      - name: Refuse to deploy from anywhere but main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Deploy runs only from main; this run is from $REF."
            exit 1
          fi

      - uses: actions/checkout@v7

      # The checks are in a script so a rollback can be rehearsed on a laptop
      # with the same code: scripts/verify-release-build.sh v0.1.0 /tmp/site
      - name: Fetch the release's stored build and verify it
        id: verify
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/verify-release-build.sh "$TAG" site

      - name: Hand the verified build to the deploy job
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The only two permissions a Pages deploy needs: pages to publish, id-token
    # so deploy-pages can prove to Pages which run is asking. No contents
    # access at all. The GitHub App is not involved: nothing here opens a pull
    # request or needs to start another workflow.
    permissions:
      pages: write
      id-token: write

    # No protection rules yet. The approval gate is slice 3, set on this
    # environment by an admin, not in this file.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      from: ${{ steps.live.outputs.from }}

    steps:
      # Pinned to full commit SHAs, as the actions that touch the release
      # credential are in release.yml: these are handed a token that can
      # publish the site. The comment names the tag each SHA was taken from.
      # Fails here, with Pages' own message, if Pages is not set to deploy from
      # GitHub Actions.
      - name: Read the Pages site
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # What is live before this deploy, for the backout record. Unknown when
      # nothing has been deployed yet or the live site has no readable
      # build-info.json; that is reported, not guessed.
      - name: Read what is live now
        id: live
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          live="$(curl -fsS --max-time 10 "$BASE_URL/build-info.json" 2>/dev/null || true)"
          from="$(jq -r 'if .version and .commit then "v\(.version) (\(.commit))" else empty end' <<<"$live" 2>/dev/null || true)"
          echo "from=${from:-unknown}" >> "$GITHUB_OUTPUT"
          echo "Live before this deploy: ${from:-unknown}"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The live site, checked by the same @smoke specs the e2e gate runs, pointed
  # at the address deploy-pages reported rather than at a local preview. It
  # also has to serve exactly the build prepare verified: EXPECTED_VERSION and
  # EXPECTED_COMMIT turn the build-info spec from a shape check into an exact
  # one, which polls for a bounded time while the CDN in front of Pages
  # catches up (e2e/gates.spec.ts). Its own job, so it holds no Pages
  # permission: it only reads the public site.
  smoke:
    name: smoke
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    outputs:
      passed: ${{ steps.results.outputs.passed }}
      failed: ${{ steps.results.outputs.failed }}
      total: ${{ steps.results.outputs.total }}
      green_at: ${{ steps.green.outputs.green_at }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the smoke checks against the live site
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: smoke-results.json
        run: npm run e2e:smoke -- --reporter=github,json

      # The clock for the backout record stops here, at smoke green.
      - name: Record when the smoke went green
        id: green
        run: echo "green_at=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Count the results
        id: results
        if: always()
        run: |
          if [ -f smoke-results.json ]; then
            jq -r '.stats | "passed=\(.expected)", "failed=\(.unexpected + .flaky)", "total=\(.expected + .unexpected + .flaky + .skipped)"' \
              smoke-results.json >> "$GITHUB_OUTPUT"
          fi

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The backout record, written whether the deploy and the smoke worked or
  # not, once prepare has accepted the tag (a refusal writes its own summary).
  # Its three fields are the release owner's: what is reverted (what was
  # deployed over what), who tested it, and how long it took against the 15
  # minute rollback target, with the clock stopped at smoke green. Who started
  # the run is a supporting row, not one of the three. No permissions: it only
  # writes this run's summary.
  record:
    name: record
    needs: [prepare, deploy, smoke]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions: {}

    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      STARTED_AT: ${{ needs.prepare.outputs.started_at }}
      TIMER_BASIS: ${{ needs.prepare.outputs.timer_basis }}
      TRIGGERED_BY: ${{ github.triggering_actor }}
      FROM: ${{ needs.deploy.outputs.from || 'unknown' }}
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      SMOKE_RESULT: ${{ needs.smoke.result }}
      PASSED: ${{ needs.smoke.outputs.passed }}
      FAILED: ${{ needs.smoke.outputs.failed }}
      TOTAL: ${{ needs.smoke.outputs.total }}
      GREEN_AT: ${{ needs.smoke.outputs.green_at }}
      RUNBOOK: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/RELEASE.md#2-rollback

    steps:
      - name: Write the backout record
        run: |
          case "$DEPLOY_RESULT" in
            success) deployed="deployed" ;;
            *) deployed="not deployed (deploy job: $DEPLOY_RESULT)" ;;
          esac

          case "$SMOKE_RESULT" in
            success) tested="smoke suite passed, ${PASSED:-?} of ${TOTAL:-?} tests" ;;
            failure) tested="smoke suite FAILED, ${FAILED:-?} of ${TOTAL:-?} tests failed" ;;
            *) tested="not tested: the smoke suite did not run (smoke job: $SMOKE_RESULT)" ;;
          esac
          tested="$tested; approver: none yet (phase 3, slice 3)"

          if [ "$SMOKE_RESULT" = "success" ] && [ -n "$GREEN_AT" ]; then
            stop="$GREEN_AT"
            stopped="stopped at smoke green"
          else
            stop="$(date -u +%s)"
            stopped="stopped at the end of the run, with no smoke green: not restored"
          fi
          elapsed=$(( stop - STARTED_AT ))

          {
            echo "### Backout record"
            echo
            if [ "$SMOKE_RESULT" != "success" ]; then
              echo "**The live site is not verified.** If the deploy reached it, roll back to the last known good tag: [docs/RELEASE.md, Rollback]($RUNBOOK)."
              echo
            fi
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| What is reverted | $TAG ($COMMIT) deployed over $FROM |"
            echo "| Who tested it | $tested |"
            echo "| How long | $(( elapsed / 60 ))m $(( elapsed % 60 ))s against the 15 minute rollback target; clock $TIMER_BASIS, $stopped |"
            echo "| Started by | $TRIGGERED_BY |"
            echo "| Deploy result | $deployed |"
            echo "| Address | ${PAGE_URL:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"
