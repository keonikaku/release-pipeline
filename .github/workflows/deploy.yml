name: Deploy

# Put a published release on GitHub Pages, then check the live site. Phase 3:
# slice 1 (deploy), slice 2 (smoke), slice 3 (the approval gate, an
# environment setting) and slice 4 (started by release.yml when it publishes a
# release). Documented in docs/RELEASE.md, which names this file and these jobs.
#
# Two ways in, the same jobs either way:
#   - workflow_call, from release.yml's `deploy` job, right after `publish`
#     makes a release public. That is a release going live.
#   - workflow_dispatch, by hand: any published tag, including an older one,
#     which is a rollback.
#
# The same workflow is the deploy and the rollback. Deploying the newest tag is
# a release going live; deploying an older tag is a rollback. Either way it
# deploys the build stored on that release, the archive release.yml attached
# after the full gate set passed on the tagged commit. Nothing is rebuilt from
# source. A rebuild would be a new, untested artifact; the stored one is the
# artifact that was tested.
#
# By hand, run it from main (Actions, Deploy, Run workflow, branch main) with
# the tag to deploy. `prepare` refuses any other branch. Called from
# release.yml, the run is the Release run on main: a called workflow's
# `github` context is its caller's, so github.ref is still refs/heads/main.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy, for example v0.1.0. An older tag is a rollback."
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag release.yml just published."
        required: true
        type: string

# Nothing by default. Each job asks for exactly what it uses.
permissions: {}

concurrency:
  # One deploy at a time, and a running deploy is never cancelled: a cancelled
  # Pages deploy can leave it unclear which version is live. GitHub keeps at
  # most one pending run in a group, so a third dispatch while one runs and one
  # waits cancels the waiting one. docs/RELEASE.md says what to do about that.
  #
  # Not the same name as release.yml's group (release-<ref>), on purpose.
  # GitHub's reusable-workflow reference warns that the same
  # jobs.<job_id>.concurrency.group in caller and called workflows, with
  # cancel-in-progress: true, "will cause the workflow that's already running
  # to be cancelled". These are workflow-level groups without cancelling, so
  # what a shared name would do here is inferred, not documented; distinct
  # names avoid it. Whether this workflow-level group also applies when the
  # workflow is called, rather than dispatched, is not stated in GitHub's docs
  # and not observed; docs/RELEASE.md, "Deploy on release", says what follows.
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Read the release and its assets, and read this run's own record for the
    # time it was created. Nothing is written.
    permissions:
      contents: read
      actions: read

    outputs:
      started_at: ${{ steps.start.outputs.started_at }}
      timer_basis: ${{ steps.start.outputs.timer_basis }}
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
      commit: ${{ steps.verify.outputs.commit }}

    steps:
      # Time to restore starts when someone presses Run workflow, not when a
      # runner picks the job up, so the clock starts at the run's creation and
      # includes queue and runner wait. On a re-run it is still the first
      # attempt's creation: the clock does not restart because a try failed.
      # If the run record cannot be read, the clock starts here instead and the
      # backout record says so.
      - name: Record when this run was created
        id: start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          created="$(gh api "$RUN_URL" --jq .created_at 2>/dev/null || true)"
          if started="$(date -u -d "$created" +%s 2>/dev/null)" && [ -n "$created" ]; then
            echo "started_at=$started" >> "$GITHUB_OUTPUT"
            echo "timer_basis=from the run's creation ($created), including queue time" >> "$GITHUB_OUTPUT"
          else
            echo "started_at=$(date -u +%s)" >> "$GITHUB_OUTPUT"
            echo "timer_basis=from the start of prepare, excluding queue time (the run's creation time could not be read)" >> "$GITHUB_OUTPUT"
          fi

      # The workflow that runs is the one on the branch it was dispatched from.
      # Only main's copy has been through review, so only main's copy deploys.
      # This holds whatever the github-pages environment's branch rule says.
      - name: Refuse to deploy from anywhere but main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Deploy runs only from main; this run is from $REF."
            exit 1
          fi

      - uses: actions/checkout@v7

      # The checks are in a script so a rollback can be rehearsed on a laptop
      # with the same code: scripts/verify-release-build.sh v0.1.0 /tmp/site
      - name: Fetch the release's stored build and verify it
        id: verify
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/verify-release-build.sh "$TAG" site

      - name: Hand the verified build to the deploy job
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The only two permissions a Pages deploy needs: pages to publish, id-token
    # so deploy-pages can prove to Pages which run is asking. No contents
    # access at all. The GitHub App is not involved: nothing here opens a pull
    # request or needs to start another workflow.
    permissions:
      pages: write
      id-token: write

    # The approval gate (phase 3, slice 3) is not in this file. It is a
    # required reviewer on the github-pages environment, set by an admin in
    # the repository's settings, and GitHub holds this job in Waiting until a
    # reviewer approves it. Nothing here changes when the gate is switched on
    # or off; the backout record reads who approved, if anyone, from the run.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      from: ${{ steps.live.outputs.from }}

    steps:
      # Pinned to full commit SHAs, as the actions that touch the release
      # credential are in release.yml: these are handed a token that can
      # publish the site. The comment names the tag each SHA was taken from.
      # Fails here, with Pages' own message, if Pages is not set to deploy from
      # GitHub Actions.
      - name: Read the Pages site
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # What is live before this deploy, for the backout record. Unknown when
      # nothing has been deployed yet or the live site has no readable
      # build-info.json; that is reported, not guessed.
      - name: Read what is live now
        id: live
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          live="$(curl -fsS --max-time 10 "$BASE_URL/build-info.json" 2>/dev/null || true)"
          from="$(jq -r 'if .version and .commit then "v\(.version) (\(.commit))" else empty end' <<<"$live" 2>/dev/null || true)"
          echo "from=${from:-unknown}" >> "$GITHUB_OUTPUT"
          echo "Live before this deploy: ${from:-unknown}"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The live site, checked by the same @smoke specs the e2e gate runs, pointed
  # at the address deploy-pages reported rather than at a local preview. It
  # also has to serve exactly the build prepare verified: EXPECTED_VERSION and
  # EXPECTED_COMMIT turn the build-info spec from a shape check into an exact
  # one, which polls for up to 660 seconds while the CDN in front of Pages
  # catches up (e2e/gates.spec.ts says why that long). Its own job, so it
  # holds no Pages permission: it only reads the public site.
  #
  # The specs are main's, checked out here, not the deployed release's. A
  # rollback to an older release is smoked with today's specs; see the known
  # gaps in docs/RELEASE.md.
  smoke:
    name: smoke
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    # The 660 second wait plus Playwright's extra minute (12 minutes), and
    # room for npm ci and the browser install.
    timeout-minutes: 20

    permissions:
      contents: read

    outputs:
      passed: ${{ steps.results.outputs.passed }}
      failed: ${{ steps.results.outputs.failed }}
      total: ${{ steps.results.outputs.total }}
      green_at: ${{ steps.green.outputs.green_at }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the smoke checks against the live site
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: smoke-results.json
          PLAYWRIGHT_HTML_OPEN: never
        # github: annotations on the run. json: the counts for the record.
        # html: the report uploaded below if the smoke fails.
        run: npm run e2e:smoke -- --reporter=github,json,html

      # The clock for the backout record stops here, at smoke green.
      - name: Record when the smoke went green
        id: green
        run: echo "green_at=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Count the results
        id: results
        if: always()
        run: |
          if [ -f smoke-results.json ]; then
            jq -r '.stats | "passed=\(.expected)", "failed=\(.unexpected + .flaky)", "total=\(.expected + .unexpected + .flaky + .skipped)"' \
              smoke-results.json >> "$GITHUB_OUTPUT"
          fi

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The backout record, written whether the deploy and the smoke worked or
  # not, once prepare has accepted the tag (a refusal writes its own summary).
  # Its three fields are the release owner's: what is reverted (what was
  # deployed over what), who tested it, and how long it took against the 15
  # minute rollback target, with the clock stopped at smoke green. Who started
  # the run is a supporting row, not one of the three. actions: read, and
  # nothing else, to read this run's own approval history.
  record:
    name: record
    needs: [prepare, deploy, smoke]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # GET /repos/{owner}/{repo}/actions/runs/{run_id}/approvals, "Get the
    # review history for a workflow run", is listed under the "Actions"
    # repository permission, read, in docs.github.com/en/rest/authentication/
    # permissions-required-for-fine-grained-personal-access-tokens.
    permissions:
      actions: read

    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      STARTED_AT: ${{ needs.prepare.outputs.started_at }}
      TIMER_BASIS: ${{ needs.prepare.outputs.timer_basis }}
      TRIGGERED_BY: ${{ github.triggering_actor }}
      # workflow_dispatch for a deploy by hand; push when release.yml called
      # this workflow from the Release run for the merge of a release pull
      # request (a called workflow sees its caller's event).
      EVENT_NAME: ${{ github.event_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FROM: ${{ needs.deploy.outputs.from || 'unknown' }}
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      SMOKE_RESULT: ${{ needs.smoke.result }}
      PASSED: ${{ needs.smoke.outputs.passed }}
      FAILED: ${{ needs.smoke.outputs.failed }}
      TOTAL: ${{ needs.smoke.outputs.total }}
      GREEN_AT: ${{ needs.smoke.outputs.green_at }}
      RUNBOOK: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/RELEASE.md#2-rollback

    steps:
      # Who approved the deploy job's environment, from the run's own review
      # history. Logins only: a reviewer's comment is free text and does not
      # go into a table cell. An empty history means no reviewer was required,
      # or possibly an admin bypass: whether a bypass appears in this history
      # is inferred, not observed, and GitHub's docs do not say.
      #
      # This step must not cost the record. Any response that is not the
      # documented list (an API error, an empty body, non-JSON, an object, or
      # any entry that is not an object with a list of environments) gives
      # "could not be read" instead of failing. An approval whose login is
      # missing or not a plain login is reported as such, not as none. The
      # step is also continue-on-error, and the record step below runs
      # whatever happens here.
      - name: Read who approved the deploy
        id: approval
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVALS_URL: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/approvals
        run: |
          approver="approver: could not be read from the run's review history"
          if history="$(gh api "$APPROVALS_URL" 2>/dev/null)" &&
            parsed="$(jq -r '
              if type != "array" then error("not a list") else . end
              | if all(.[]; type == "object" and (.environments | type) == "array")
                then . else error("malformed entry") end
              | [ .[]
                  | select(any(.environments[]; type == "object" and .name == "github-pages"))
                  | {state, login: (.user.login? // "")}
                  | .login |= (if type == "string" and test("^[A-Za-z0-9-]+(\\[bot\\])?$") then . else "" end) ]
              | "approved=\([.[] | select(.state == "approved") | .login | select(. != "")] | unique | join(", "))",
                "rejected=\([.[] | select(.state == "rejected") | .login | select(. != "")] | unique | join(", "))",
                "approvals=\([.[] | select(.state == "approved")] | length)",
                "rejections=\([.[] | select(.state == "rejected")] | length)"
            ' <<<"$history" 2>/dev/null)" && [ -n "$parsed" ]; then
            approved="$(sed -n 's/^approved=//p' <<<"$parsed")"
            rejected="$(sed -n 's/^rejected=//p' <<<"$parsed")"
            approvals="$(sed -n 's/^approvals=//p' <<<"$parsed")"
            rejections="$(sed -n 's/^rejections=//p' <<<"$parsed")"
            if [ -n "$approved" ]; then
              approver="approver: $approved"
            elif [ "${approvals:-0}" != "0" ]; then
              approver="approver: an approval is recorded, but its login could not be read"
            elif [ -n "$rejected" ]; then
              approver="approver: none; rejected by $rejected"
            elif [ "${rejections:-0}" != "0" ]; then
              approver="approver: none; a rejection is recorded, but its login could not be read"
            else
              approver="approver: none recorded (no reviewer was required, or possibly an admin bypass)"
            fi
          fi
          echo "approver=$approver" >> "$GITHUB_OUTPUT"

      - name: Write the backout record
        if: always()
        env:
          APPROVER: ${{ steps.approval.outputs.approver }}
        run: |
          case "$DEPLOY_RESULT" in
            success) deployed="deployed" ;;
            *) deployed="not deployed (deploy job: $DEPLOY_RESULT)" ;;
          esac

          case "$SMOKE_RESULT" in
            success) tested="smoke suite passed, ${PASSED:-?} of ${TOTAL:-?} tests" ;;
            failure) tested="smoke suite FAILED, ${FAILED:-?} of ${TOTAL:-?} tests failed" ;;
            *) tested="not tested: the smoke suite did not run (smoke job: $SMOKE_RESULT)" ;;
          esac
          tested="$tested; ${APPROVER:-approver: could not be read}"

          case "$EVENT_NAME" in
            workflow_dispatch) trigger="a deploy started by hand (Run workflow), [run]($RUN_URL)" ;;
            push) trigger="a release publish: release.yml called this deploy after publishing $TAG, [Release run]($RUN_URL)" ;;
            *) trigger="$EVENT_NAME, [run]($RUN_URL)" ;;
          esac

          if [ "$SMOKE_RESULT" = "success" ] && [ -n "$GREEN_AT" ]; then
            stop="$GREEN_AT"
            stopped="stopped at smoke green, so it includes any wait for approval and the wait for the CDN to serve the new build"
          else
            stop="$(date -u +%s)"
            stopped="stopped at the end of the run, with no smoke green: not restored"
          fi
          elapsed=$(( stop - STARTED_AT ))

          {
            echo "### Backout record"
            echo
            if [ "$SMOKE_RESULT" != "success" ]; then
              echo "**The live site is not verified.** If the deploy reached it, roll back to the last known good tag: [docs/RELEASE.md, Rollback]($RUNBOOK)."
              echo
            fi
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| What is reverted | $TAG ($COMMIT) deployed over $FROM |"
            echo "| Who tested it | $tested |"
            echo "| How long | $(( elapsed / 60 ))m $(( elapsed % 60 ))s against the 15 minute rollback target; clock $TIMER_BASIS, $stopped |"
            echo "| Started by | $TRIGGERED_BY |"
            echo "| Triggered by | $trigger |"
            echo "| Deploy result | $deployed |"
            echo "| Address | ${PAGE_URL:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"
