name: Release

# Versioning, changelog, tag and published release, derived from the
# conventional commit subjects on main. Documented in docs/RELEASE.md, which
# names this file and these job names. The choice of credential is decision
# record docs/decisions/0004-a-github-app-token-for-the-release-pull-request.md.
#
# Two things happen here, on different pushes to main:
#
#   1. An ordinary change lands. release-please opens, or updates, one release
#      pull request carrying the next version, the changelog entry, and the
#      version bump in package.json. Nothing is tagged. The pull request stays
#      open and accumulates changes until a person merges it.
#   2. That release pull request is merged. release-please tags the merge
#      commit and creates the release as a DRAFT. The full CI gate set then
#      runs again on the tagged commit, the build it produced is checked
#      against the tag and attached, and only then is the release published.
#
# The order in step 2 is the point. A published release always has its build
# attached and always passed the gates on the exact commit it names. If any
# step fails, the release stays a draft, which only people with write access
# can see, rather than being public and incomplete.

on:
  push:
    branches: [main]

# Nothing by default. Each job asks for exactly what it uses.
permissions: {}

concurrency:
  # One release run at a time, and never cancelled part way. A cancelled run
  # could leave a tag with no release, or a draft with no build. A queued run
  # is harmless: release-please reads main as it is when the run starts.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The default GITHUB_TOKEN is not used by this job at all. Everything it
    # writes, it writes with the GitHub App token below, for the reason in
    # decision 0004: a release pull request opened with GITHUB_TOKEN does not
    # start the gates without a manual approval, so the gates would not
    # reliably run on the one pull request whose contents become a release.
    permissions: {}

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      # Fails loudly, with the fix in the message, rather than letting the
      # token step fail with something less obvious. There is deliberately no
      # fallback to GITHUB_TOKEN: a fallback would bring back the problem the
      # credential exists to solve, and do it silently.
      - name: Check the release credential is configured
        env:
          HAS_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
          HAS_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          missing=0
          if [ "$HAS_CLIENT_ID" != "true" ]; then
            echo "::error::Repository variable RELEASE_APP_CLIENT_ID is not set. See docs/decisions/0004-a-github-app-token-for-the-release-pull-request.md."
            missing=1
          fi
          if [ "$HAS_PRIVATE_KEY" != "true" ]; then
            echo "::error::Repository secret RELEASE_APP_PRIVATE_KEY is not set. See docs/decisions/0004-a-github-app-token-for-the-release-pull-request.md."
            missing=1
          fi
          exit "$missing"

      # A short-lived installation token, scoped to this repository and cut
      # down to the three permissions release-please uses. It expires after an
      # hour whatever happens to this run.
      - name: Mint a token from the release GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # contents: the release branch, the tag, the release.
          # pull-requests: open and update the release pull request.
          # issues: the `autorelease: pending` and `autorelease: tagged` labels,
          # which GitHub files under the issues permission.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Open or update the release pull request, or tag a merged one
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # verify builds whatever this run checked out, which is github.sha. The
      # release names the commit release-please tagged. Those are the same
      # commit when this run was started by the merge of the release pull
      # request, which is the only way a release is created. If they ever
      # differ, stop here rather than attach a build of one commit to a
      # release of another. The release is left as a draft.
      - name: Check the tagged commit is the commit this run will build
        if: steps.release.outputs.release_created == 'true'
        env:
          TAGGED: ${{ steps.release.outputs.sha }}
          BUILT: ${{ github.sha }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ "$TAGGED" != "$BUILT" ]; then
            echo "::error::$TAG was tagged at $TAGGED but this run would build $BUILT. Release left as a draft."
            exit 1
          fi
          echo "$TAG tagged at $TAGGED, which is the commit this run builds."

  # The whole CI gate set, again, on the tagged commit: lint, typecheck, test,
  # audit, build, e2e. Not a copy of those jobs, the same file, called. Its
  # build job uploads `dist`, its e2e job tests that upload, and publish below
  # attaches that same upload. The bytes attached to the release are the bytes
  # the browser suite ran against. pr-title reports as skipped here, because
  # there is no pull request in a push run.
  verify:
    name: verify
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish
    needs: [release-please, verify]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # GITHUB_TOKEN is enough here. Uploading an asset and publishing a release
    # does not need to start any other workflow, so the limitation that rules
    # it out for the release pull request does not apply.
    permissions:
      contents: write

    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      SHA: ${{ needs.release-please.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download the build that verify tested
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # REQ-4.2. The build says what it is. Refuse to attach it to a release it
      # does not match: a different version, a different commit, or a build
      # made from a working tree with uncommitted changes in it.
      - name: Check the build names this release
        run: |
          cat dist/build-info.json
          jq -e --arg v "$VERSION" --arg c "$SHA" \
            '.version == $v and .commit == $c and .dirty == false' \
            dist/build-info.json > /dev/null || {
            echo "::error::dist/build-info.json does not match $TAG ($VERSION at $SHA). Release left as a draft."
            exit 1
          }

      - name: Package the build
        run: |
          asset="release-pipeline-${TAG}.tar.gz"
          tar -czf "$asset" -C dist .
          sha256sum "$asset" > "$asset.sha256"
          cat "$asset.sha256"

      - name: Attach the build and publish the release
        run: |
          asset="release-pipeline-${TAG}.tar.gz"
          gh release upload "$TAG" "$asset" "$asset.sha256" --clobber
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json tagName,isDraft,url,assets \
            --jq '{tagName, isDraft, url, assets: [.assets[].name]}'
