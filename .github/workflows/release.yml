name: Release

# Versioning, changelog, tag and published release, derived from the
# conventional commit subjects on main. Documented in docs/RELEASE.md, which
# names this file and these job names. The choice of credential is decision
# record docs/decisions/0004-a-github-app-token-for-the-release-pull-request.md.
#
# Two things happen here, on different pushes to main:
#
#   1. An ordinary change lands. release-please opens, or updates, one release
#      pull request carrying the next version, the changelog entry, and the
#      version bump in package.json. Nothing is tagged. The pull request stays
#      open and accumulates changes until a person merges it.
#   2. That release pull request is merged. release-please tags the merge
#      commit and creates the release as a DRAFT. The full CI gate set then
#      runs again on the tagged commit, the build it produced is checked
#      against the tag and attached, a "How to roll back" block naming the
#      previous published release is added to the notes, and only then is
#      the release published.
#
#   3. Then the release is deployed: the `deploy` job calls deploy.yml, which
#      waits at the github-pages approval gate, deploys the stored build, and
#      smokes the live site (phase 3, slice 4).
#
# The order in step 2 is the point. A published release always has its build
# attached and always passed the gates on the exact commit it names. If any
# step fails, the release stays a draft, which only people with write access
# can see, rather than being public and incomplete.

on:
  push:
    branches: [main]

# Nothing by default. Each job asks for exactly what it uses.
permissions: {}

concurrency:
  # One release run at a time, and never cancelled part way. A cancelled run
  # could leave a tag with no release, or a draft with no build. Queued runs
  # are not all kept: GitHub holds at most one pending run per group and
  # cancels an older pending run when a newer one arrives. The newer run reads
  # main as it is when it starts, and the tagged-vs-built check stops a
  # mismatch from publishing, but it can leave a stranded
  # draft release. Cleanup: docs/RELEASE.md, "A stranded draft release".
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The default GITHUB_TOKEN is not used by this job at all. Everything it
    # writes, it writes with the GitHub App token below, for the reason in
    # decision 0004: a release pull request opened with GITHUB_TOKEN does not
    # start the gates without a manual approval, so the gates would not
    # reliably run on the one pull request whose contents become a release.
    permissions: {}

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      # Fails loudly, with the fix in the message, rather than letting the
      # token step fail with something less obvious. There is deliberately no
      # fallback to GITHUB_TOKEN: a fallback would bring back the problem the
      # credential exists to solve, and do it silently.
      - name: Check the release credential is configured
        env:
          HAS_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
          HAS_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          missing=0
          if [ "$HAS_CLIENT_ID" != "true" ]; then
            echo "::error::Repository variable RELEASE_APP_CLIENT_ID is not set. See docs/decisions/0004-a-github-app-token-for-the-release-pull-request.md."
            missing=1
          fi
          if [ "$HAS_PRIVATE_KEY" != "true" ]; then
            echo "::error::Repository secret RELEASE_APP_PRIVATE_KEY is not set. See docs/decisions/0004-a-github-app-token-for-the-release-pull-request.md."
            missing=1
          fi
          exit "$missing"

      # A short-lived installation token, scoped to this repository and cut
      # down to the three permissions release-please uses. It expires after an
      # hour whatever happens to this run.
      # Pinned to a full commit SHA, as is release-please-action below: these
      # two actions handle the App key and the token it mints, so a moved tag
      # must not be able to change what runs. The SHA is the commit tag v3.3.0
      # names in actions/create-github-app-token. Dependabot updates the SHA
      # and the comment together. Every other action stays on a major tag, as
      # in phase 1: none of them is handed a credential beyond the run's own
      # scoped GITHUB_TOKEN.
      - name: Mint a token from the release GitHub App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # contents: the release branch, the tag, the release.
          # pull-requests: open and update the release pull request.
          # issues: the `autorelease: pending` and `autorelease: tagged` labels,
          # which GitHub files under the issues permission.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Open or update the release pull request, or tag a merged one
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # verify builds whatever this run checked out, which is github.sha. The
      # release names the commit release-please tagged. Those are the same
      # commit when this run was started by the merge of the release pull
      # request, which is the only way a release is created. If they ever
      # differ, stop here rather than attach a build of one commit to a
      # release of another. The release is left as a draft.
      - name: Check the tagged commit is the commit this run will build
        if: steps.release.outputs.release_created == 'true'
        env:
          TAGGED: ${{ steps.release.outputs.sha }}
          BUILT: ${{ github.sha }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ "$TAGGED" != "$BUILT" ]; then
            echo "::error::$TAG was tagged at $TAGGED but this run would build $BUILT. Release left as a draft."
            exit 1
          fi
          echo "$TAG tagged at $TAGGED, which is the commit this run builds."

  # The whole CI gate set, again, on the tagged commit: lint, typecheck, test,
  # audit, build, e2e. Not a copy of those jobs, the same file, called. Its
  # build job uploads `dist`, its e2e job tests that upload, and publish below
  # attaches that same upload. The bytes attached to the release are the bytes
  # the browser suite ran against. pr-title reports as skipped here, because
  # there is no pull request in a push run.
  verify:
    name: verify
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish
    needs: [release-please, verify]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # GITHUB_TOKEN is enough here. Uploading an asset and publishing a release
    # does not need to start any other workflow, so the limitation that rules
    # it out for the release pull request does not apply.
    permissions:
      contents: write

    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      SHA: ${{ needs.release-please.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      # The rollback block's template, read at the tagged commit, so the
      # block a release carries is the one that release was built with.
      # Sparse in cone mode, so the root-level files come too; nothing reads
      # them. No credentials are left in the checkout: nothing here pushes.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          sparse-checkout: .github/release-notes
          persist-credentials: false

      - name: Download the build that verify tested
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # REQ-4.2. The build says what it is. Refuse to attach it to a release it
      # does not match: a different version, a different commit, or a build
      # made from a working tree with uncommitted changes in it.
      - name: Check the build names this release
        run: |
          cat dist/build-info.json
          jq -e --arg v "$VERSION" --arg c "$SHA" \
            '.version == $v and .commit == $c and .dirty == false' \
            dist/build-info.json > /dev/null || {
            echo "::error::dist/build-info.json does not match $TAG ($VERSION at $SHA). Release left as a draft."
            exit 1
          }

      - name: Package the build
        run: |
          asset="release-pipeline-${TAG}.tar.gz"
          tar -czf "$asset" -C dist .
          sha256sum "$asset" > "$asset.sha256"
          cat "$asset.sha256"

      # Every published release says how to undo it. release-please writes
      # the changelog entry as the release body and has no option to add a
      # generated block to it (its pull-request-header and -footer options
      # are for the release pull request only), so the block is added here.
      #
      # This release is still a draft, so the latest published release is
      # the one before it. "Latest" is gh's order: CREATED_AT descending,
      # and a release's createdAt has equalled its tagged commit's committer
      # date (observed on v0.1.0 to v0.3.0), so this is the published
      # release whose tagged commit is newest, drafts and prereleases
      # filtered out. On a linear main that is the previous release. That is the previous good tag, "good" meaning it was
      # published after the full gate set passed on its commit, not that it
      # was health checked now. If there is none, or what comes back does not
      # look like a release of this repository, fail and leave the draft, as
      # every other step in this job does. Nothing is edited here: the notes
      # are written to a file and go up in the same edit that publishes.
      #
      # The click path is copied from docs/RELEASE.md, "Deploying a release,
      # or rolling back to one", steps 1 and 3. Change them together.
      - name: Write the rollback block into the release notes
        env:
          TEMPLATE: .github/release-notes/rollback.md
        run: |
          fail() { echo "::error::$1 Release left as a draft."; exit 1; }

          is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)" ||
            fail "Could not read $TAG."
          if [ "$is_draft" != "true" ]; then
            echo "::error::$TAG is already published, so its notes were already written. Not appending the block a second time. This fails publish, so deploy is skipped: to deploy $TAG, start it by hand: Actions > Deploy > Run workflow, branch main, tag $TAG."
            exit 1
          fi

          prev="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 \
            --json tagName --jq '.[0].tagName // empty')" ||
            fail "Could not list the published releases."
          [ -n "$prev" ] || fail "No published release before $TAG, so there is no previous good tag to roll back to."
          [ "$prev" != "$TAG" ] || fail "The latest published release is $TAG itself."
          [[ "$prev" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "Latest published release '$prev' is not a v<major>.<minor>.<patch> tag."

          commit="$(gh api "repos/$GH_REPO/commits/$prev" --jq .sha)" ||
            fail "Could not read the commit $prev names."
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || fail "$prev resolved to '$commit', not a commit SHA."

          url="$(gh release view "$prev" --json url --jq .url)" ||
            fail "Could not read the address of $prev."
          [ "$url" = "https://github.com/$GH_REPO/releases/tag/$prev" ] ||
            fail "$prev has address '$url', not this repository's release page."

          gh release view "$TAG" --json body --jq .body > notes.md ||
            fail "Could not read the notes of $TAG."
          printf '\n\n' >> notes.md
          sed -e "s|{PREV_TAG}|$prev|g" -e "s|{PREV_COMMIT}|$commit|g" \
            -e "s|{PREV_URL}|$url|g" "$TEMPLATE" >> notes.md
          if grep -qE '\{PREV_[A-Z]+\}' notes.md; then
            fail "The rollback block still has a placeholder in it."
          fi

          echo "Previous good tag: $prev ($commit), $url"
          cat notes.md

      - name: Attach the build and publish the release
        run: |
          asset="release-pipeline-${TAG}.tar.gz"
          gh release upload "$TAG" "$asset" "$asset.sha256" --clobber
          gh release edit "$TAG" --notes-file notes.md --draft=false
          gh release view "$TAG" --json tagName,isDraft,url,assets \
            --jq '{tagName, isDraft, url, assets: [.assets[].name]}'

  # Phase 3, slice 4: a published release goes live, through the same gate as
  # any deploy. This calls deploy.yml rather than letting it listen for the
  # release being published, for two reasons:
  #   - The release is published by `publish` above with GITHUB_TOKEN, and
  #     events made with GITHUB_TOKEN do not start workflows (the only
  #     exceptions are workflow_dispatch and repository_dispatch).
  #   - A `release` event runs with github.ref set to the tag. The
  #     github-pages environment only lets main deploy, and deploy.yml's
  #     `prepare` refuses anything but main. A called workflow keeps its
  #     caller's `github` context, so here github.ref is refs/heads/main.
  #
  # The approval still applies: deploy.yml's `deploy` job names the
  # github-pages environment, and its required reviewer holds that job in
  # Waiting until approved. While it waits, this Release run is still running
  # and holds the release-<ref> concurrency group; see docs/RELEASE.md,
  # "Deploy on release", for what that does to later pushes.
  #
  # Permissions: a called workflow's GITHUB_TOKEN can only be the caller's or
  # less, so this job grants exactly the union of what deploy.yml's jobs ask
  # for, and each of those jobs narrows it again: contents read (prepare,
  # smoke), actions read (prepare, record), pages write and id-token write
  # (deploy).
  deploy:
    name: deploy
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
